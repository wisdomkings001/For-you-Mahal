<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mahal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --plum: #3b1f4d;
    --plum-deep: #241130;
    --lavender: #b79fd6;
    --blush: #f0c9dd;
    --white: #fdfbff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--plum-deep);
    font-family: 'Jost', sans-serif;
    overflow: hidden;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 20%, var(--plum) 0%, var(--plum-deep) 70%);
  }

  /* floating flowers, ambient, quiet */
  .petal-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .petal {
    position: absolute;
    opacity: 0.35;
    animation: drift 14s ease-in-out infinite;
  }

  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  /* ---------- INTRO ---------- */
  #intro {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    z-index: 5;
    transition: opacity 1s ease, transform 1s ease;
    padding: 24px;
    text-align: center;
  }

  #intro.wipe {
    opacity: 0;
    transform: scale(1.08);
    pointer-events: none;
  }

  .intro-message {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 6vw, 40px);
    color: var(--white);
    opacity: 0;
    animation: fadeUp 1.6s ease forwards 0.4s;
    letter-spacing: 0.02em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* envelope */
  #envelope-wrap {
    opacity: 0;
    animation: fadeUp 1.6s ease forwards 1.6s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  #envelope {
    width: 150px;
    height: 100px;
    cursor: pointer;
    background: linear-gradient(160deg, var(--blush), var(--lavender));
    border-radius: 6px;
    position: relative;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    animation: pulse 2.4s ease-in-out infinite;
    border: none;
    padding: 0;
  }

  #envelope::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-left: 75px solid transparent;
    border-right: 75px solid transparent;
    border-top: 55px solid var(--white);
    opacity: 0.9;
  }

  #envelope::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }

  @keyframes pulse {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.03); }
  }

  .click-label {
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--blush);
  }

  /* ---------- LETTER ---------- */
  #letter-wrap {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 4;
    padding: 28px 18px 40px;
  }

  #letter-wrap.show {
    display: flex;
  }

  #letter-card {
    max-width: 640px;
    width: 100%;
    max-height: 100%;
    overflow-y: auto;
    background: rgba(253, 251, 255, 0.97);
    border-radius: 14px;
    padding: 40px 32px 34px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(24px) scale(0.98);
    animation: cardIn 1.1s ease forwards 0.15s;
    position: relative;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .flower-divider {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }

  .flower-divider svg {
    width: 46px;
    height: 46px;
    opacity: 0;
    animation: bloom 1.2s ease forwards 0.5s;
  }

  @keyframes bloom {
    from { opacity: 0; transform: scale(0.4) rotate(-20deg); }
    to { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .whisper {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--lavender);
    font-size: 15px;
    margin: 0 0 22px;
    letter-spacing: 0.04em;
  }

  .letter-body {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(17px, 2.4vw, 20px);
    line-height: 1.75;
    color: #3a2a44;
  }

  .letter-body p {
    margin: 0 0 20px;
    opacity: 0;
    transform: translateY(10px);
    animation: paraIn 0.9s ease forwards;
  }

  .signature {
    text-align: right;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--plum);
    margin-top: 26px;
    font-size: 20px;
  }

  @keyframes paraIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* audio control */
  #sound-toggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: rgba(253,251,255,0.9);
    color: var(--plum);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #sound-toggle.visible { opacity: 1; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--lavender); border-radius: 10px; }
</style>
</head>
<body>

<div id="stage">
  <div class="petal-field" id="petalField"></div>

  <div id="intro">
    <div class="intro-message">A message for you,<br>my love</div>
    <div id="envelope-wrap">
      <button id="envelope" aria-label="Open the letter"></button>
      <div class="click-label">Click me</div>
    </div>
  </div>

  <div id="letter-wrap">
    <div id="letter-card">
      <div class="flower-divider">
        <svg viewBox="0 0 64 64" fill="none">
          <g fill="#b79fd6">
            <ellipse cx="32" cy="18" rx="8" ry="14"/>
            <ellipse cx="32" cy="46" rx="8" ry="14"/>
            <ellipse cx="18" cy="32" rx="14" ry="8"/>
            <ellipse cx="46" cy="32" rx="14" ry="8"/>
          </g>
          <circle cx="32" cy="32" r="7" fill="#f0c9dd"/>
        </svg>
      </div>
      

      <div class="letter-body" id="letterBody"></div>
    </div>
  </div>

  <button id="sound-toggle" aria-label="Toggle music">&#9835;</button>
  <audio id="bgm" src="song.mp3" loop preload="auto"></audio>
</div>

<script>
  const paragraphs = [
    "Mahal.. I know sometimes your mind runs wild you wonder if I really love you, if I'll stay, or if one day I'll wake up and leave (I've also been there \uD83E\uDD27). But baby, listen if I didn't want you, I wouldn't be here.",
    "I'm not with you out of convenience, I'm with you out of choice. And every day I choose you (and ofc your nyash \uD83D\uDE1A)",
    "Not the past, not someone else, not the 'what ifs' in your head.... just you. So when your thoughts start to scare you, remember that we've been through a lot and I'm still here so my actions should show you I'm loyal, and my words hopefully show you how much I care about you and all that has to do with you (if ykyk \uD83C\uDF1A\u2764)",
    "I love you soo much baby.. I can't put it all into words I wish I could be there in person to express how I feel rn (you won't get pregnant dw\uD83E\uDD27) but ik this distance will pass and we've been strong so far ik we've got this",
    "Nothing is gonna make me miss out on such an amazing person like you are so always carry my words in your heart as a reminder that I love you and don't let overthinking take that happiness away from you",
    "I hope you'll always wake up with a smile on your face knowing that someone from another part of this world loves you to the moon and back (shots)"
  ];

  const letterBody = document.getElementById('letterBody');
  paragraphs.forEach((text, i) => {
    const p = document.createElement('p');
    p.textContent = text;
    p.style.animationDelay = (0.9 + i * 0.55) + 's';
    letterBody.appendChild(p);
  });
  const sig = document.createElement('div');
  sig.className = 'signature';
  sig.innerHTML = 'Yours lovingly<br>... <em>Bubba</em> ...';
  sig.style.opacity = '0';
  sig.style.animation = `paraIn 0.9s ease forwards ${0.9 + paragraphs.length * 0.55}s`;
  letterBody.appendChild(sig);

  // ambient petals
  const field = document.getElementById('petalField');
  const petalSVG = `<svg viewBox="0 0 40 40" width="100%" height="100%"><g fill="#f0c9dd"><ellipse cx="20" cy="9" rx="6" ry="10"/><ellipse cx="20" cy="31" rx="6" ry="10"/><ellipse cx="9" cy="20" rx="10" ry="6"/><ellipse cx="31" cy="20" rx="10" ry="6"/></g><circle cx="20" cy="20" r="4" fill="#b79fd6"/></svg>`;
  const positions = [
    {top:'8%', left:'10%', size:26, delay:0}, {top:'70%', left:'6%', size:20, delay:2},
    {top:'18%', left:'85%', size:22, delay:1}, {top:'75%', left:'88%', size:28, delay:3},
    {top:'45%', left:'4%', size:18, delay:4}, {top:'40%', left:'92%', size:20, delay:1.5}
  ];
  positions.forEach(p => {
    const div = document.createElement('div');
    div.className = 'petal';
    div.style.top = p.top;
    div.style.left = p.left;
    div.style.width = p.size + 'px';
    div.style.height = p.size + 'px';
    div.style.animationDelay = p.delay + 's';
    div.innerHTML = petalSVG;
    field.appendChild(div);
  });

  const intro = document.getElementById('intro');
  const envelope = document.getElementById('envelope');
  const letterWrap = document.getElementById('letter-wrap');
  const bgm = document.getElementById('bgm');
  const soundToggle = document.getElementById('sound-toggle');

  envelope.addEventListener('click', () => {
    intro.classList.add('wipe');
    bgm.volume = 0.55;
    bgm.play().catch(() => {});
    soundToggle.classList.add('visible');
    setTimeout(() => {
      intro.style.display = 'none';
      letterWrap.classList.add('show');
    }, 900);
  });

  let muted = false;
  soundToggle.addEventListener('click', () => {
    muted = !muted;
    bgm.muted = muted;
    soundToggle.innerHTML = muted ? '&#9835;&#x2715;' : '&#9835;';
  });
</script>

</body>
</html>
