<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Things</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080810;
    --white: #f5f0eb;
    --dim: rgba(245,240,235,0.35);
    --gold: #c8a96e;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--white);
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }

  /* ── Intro screen ── */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2rem;
    z-index: 10;
    transition: opacity 1.5s ease;
  }

  #intro p {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--dim);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }

  #play-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1px solid rgba(200,169,110,0.4);
    background: transparent;
    color: var(--gold);
    font-size: 1.5rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    animation: fadeIn 1.5s ease 1s forwards;
    transition: border-color 0.3s, background 0.3s, transform 0.2s;
    padding-left: 4px;
  }

  #play-btn:hover {
    border-color: var(--gold);
    background: rgba(200,169,110,0.08);
    transform: scale(1.06);
  }

  #intro .title {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    font-weight: 300;
    font-style: italic;
    color: var(--white);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeIn 1.5s ease 0.2s forwards;
  }

  /* ── Lyrics screen ── */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }

  #stage.show {
    opacity: 1;
    pointer-events: all;
  }

  #lyric-display {
    text-align: center;
    padding: 2rem;
    max-width: 600px;
    width: 100%;
  }

  .lyric-line {
    display: block;
    font-size: clamp(1.3rem, 4vw, 2rem);
    font-weight: 300;
    line-height: 1.7;
    color: var(--white);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    min-height: 2.5rem;
  }

  .lyric-line.italic { font-style: italic; }

  .lyric-line.active {
    opacity: 1;
    transform: translateY(0);
  }

  .lyric-line.past {
    opacity: 0.18;
    transform: translateY(-8px);
  }

  /* progress bar */
  #progress {
    position: fixed;
    bottom: 0; left: 0;
    height: 1px;
    background: var(--gold);
    width: 0%;
    transition: width 0.5s linear;
    opacity: 0.5;
  }

  /* song credit */
  #credit {
    position: fixed;
    bottom: 1.5rem; right: 1.5rem;
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--dim);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1s ease;
  }

  #credit.show { opacity: 1; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<audio id="audio" src="little-thing.mp3" preload="auto"></audio>

<!-- Intro -->
<div id="intro">
  <p>I've got nothing to say</p>
  <div class="title">just listen</div>
  <button id="play-btn">&#9654;</button>
</div>

<!-- Stage -->
<div id="stage">
  <div id="lyric-display">
    <span class="lyric-line" id="l0"></span>
    <span class="lyric-line" id="l1"></span>
    <span class="lyric-line" id="l2"></span>
  </div>
</div>

<div id="progress"></div>
<div id="credit">Little Things · One Direction</div>

<script>
const audio    = document.getElementById('audio');
const intro    = document.getElementById('intro');
const stage    = document.getElementById('stage');
const credit   = document.getElementById('credit');
const progress = document.getElementById('progress');
const lines    = [document.getElementById('l0'), document.getElementById('l1'), document.getElementById('l2')];

// Lyrics with timestamps (seconds) and optional italic flag
// Timed to the official recording ~3:40
const lyrics = [
  { t: 0,    text: "",                              italic: false },
  { t: 4.5,  text: "Your hand fits in mine",        italic: false },
  { t: 7.5,  text: "like it's made just for me",    italic: true  },
  { t: 11,   text: "But bear this in mind",         italic: false },
  { t: 14,   text: "it was meant to be",            italic: true  },
  { t: 17.5, text: "And I'm joining up the dots",   italic: false },
  { t: 21,   text: "with the freckles on your cheeks", italic: true },
  { t: 24.5, text: "And it all makes sense to me",  italic: false },
  { t: 29,   text: "",                              italic: false },
  { t: 31,   text: "I know you've never loved",     italic: false },
  { t: 34,   text: "the crinkles by your eyes",     italic: true  },
  { t: 37.5, text: "when you smile",                italic: false },
  { t: 40,   text: "You've never loved",            italic: false },
  { t: 43,   text: "your stomach or your thighs",   italic: true  },
  { t: 46.5, text: "the dimples in your back",      italic: false },
  { t: 49.5, text: "at the bottom of your spine",   italic: true  },
  { t: 53,   text: "But I'll love them endlessly",  italic: false },
  { t: 58,   text: "",                              italic: false },
  { t: 60,   text: "I won't let these little things", italic: false },
  { t: 63.5, text: "slip out of my mouth",          italic: true  },
  { t: 67,   text: "But if I do",                   italic: false },
  { t: 69.5, text: "it's you",                      italic: false },
  { t: 71.5, text: "oh it's you",                   italic: true  },
  { t: 74,   text: "they add up to",                italic: false },
  { t: 77,   text: "I'm in love with you",          italic: false },
  { t: 81,   text: "and all these little things",   italic: true  },
  { t: 86,   text: "",                              italic: false },
  { t: 89,   text: "You can't go to bed",           italic: false },
  { t: 92,   text: "without a cup of tea",          italic: true  },
  { t: 95.5, text: "and maybe that's the reason",   italic: false },
  { t: 99,   text: "that you talk in your sleep",   italic: true  },
  { t: 102.5,text: "And all those conversations",   italic: false },
  { t: 106,  text: "are the secrets that I keep",   italic: true  },
  { t: 109.5,text: "though it makes no sense to me", italic: false },
  { t: 114,  text: "",                              italic: false },
  { t: 116,  text: "I know you've never loved",     italic: false },
  { t: 119,  text: "the sound of your voice on tape", italic: true },
  { t: 122.5,text: "You never want",                italic: false },
  { t: 125,  text: "to know how much you weigh",    italic: true  },
  { t: 128.5,text: "You still have to squeeze",     italic: false },
  { t: 131.5,text: "into last year's jeans",        italic: true  },
  { t: 135,  text: "But you're perfect to me",      italic: false },
  { t: 140,  text: "",                              italic: false },
  { t: 142,  text: "I won't let these little things", italic: false },
  { t: 145.5,text: "slip out of my mouth",          italic: true  },
  { t: 149,  text: "But if it's true",              italic: false },
  { t: 151.5,text: "it's you",                      italic: false },
  { t: 153.5,text: "oh it's you",                   italic: true  },
  { t: 156,  text: "they add up to",                italic: false },
  { t: 159,  text: "I'm in love with you",          italic: false },
  { t: 163,  text: "and all these little things",   italic: true  },
  { t: 168,  text: "",                              italic: false },
  { t: 171,  text: "You'll never love yourself",    italic: false },
  { t: 174.5,text: "half as much as I love you",    italic: true  },
  { t: 178.5,text: "And you'll never treat yourself", italic: false },
  { t: 182,  text: "right, darling, but I want you to", italic: true },
  { t: 186,  text: "If I let you know",             italic: false },
  { t: 189,  text: "I'm here for you",              italic: true  },
  { t: 192.5,text: "maybe you'll love yourself",    italic: false },
  { t: 196,  text: "like I love you, oh",           italic: true  },
  { t: 201,  text: "",                              italic: false },
  { t: 204,  text: "And I've just let these little things", italic: false },
  { t: 208,  text: "slip out of my mouth",          italic: true  },
  { t: 211.5,text: "'Cause it's you",               italic: false },
  { t: 214,  text: "oh it's you",                   italic: true  },
  { t: 216.5,text: "they add up to",                italic: false },
  { t: 219.5,text: "I'm in love with you",          italic: false },
  { t: 223.5,text: "and all your little things",    italic: true  },
  { t: 228,  text: "",                              italic: false },
  { t: 231,  text: "I won't let these little things", italic: false },
  { t: 234.5,text: "slip out of my mouth",          italic: true  },
  { t: 238,  text: "But if it's true",              italic: false },
  { t: 240.5,text: "it's you",                      italic: false },
  { t: 242.5,text: "oh it's you",                   italic: true  },
  { t: 245,  text: "they add up to",                italic: false },
  { t: 248,  text: "I'm in love with you",          italic: false },
  { t: 252,  text: "and all these little things",   italic: true  },
  { t: 257,  text: "",                              italic: false },
  { t: 259,  text: "🤍",                            italic: false },
];

let currentIndex = -1;
let displayQueue = []; // last 3 shown lines

function getActiveIndex(t) {
  let idx = 0;
  for (let i = 0; i < lyrics.length; i++) {
    if (lyrics[i].t <= t) idx = i;
    else break;
  }
  return idx;
}

function updateLyrics(t) {
  const idx = getActiveIndex(t);
  if (idx === currentIndex) return;
  currentIndex = idx;

  const entry = lyrics[idx];

  // Shift queue
  displayQueue.push({ text: entry.text, italic: entry.italic });
  if (displayQueue.length > 3) displayQueue.shift();

  // Render lines
  const len = displayQueue.length;
  for (let i = 0; i < 3; i++) {
    const slot = 2 - i; // slot 2 = current, 1 = prev, 0 = older
    const qIdx = len - 1 - i;
    const el = lines[slot];
    if (qIdx >= 0) {
      el.textContent = displayQueue[qIdx].text;
      el.className = 'lyric-line' + (displayQueue[qIdx].italic ? ' italic' : '');
      if (i === 0) el.classList.add('active');
      else el.classList.add('past');
    } else {
      el.textContent = '';
      el.className = 'lyric-line';
    }
  }
}

// Play button
document.getElementById('play-btn').addEventListener('click', () => {
  audio.play().catch(() => {});
  intro.style.opacity = '0';
  intro.style.pointerEvents = 'none';
  setTimeout(() => { intro.style.display = 'none'; }, 1500);
  stage.classList.add('show');
  credit.classList.add('show');
});

// Update loop
audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime;
  const d = audio.duration || 1;
  progress.style.width = (t / d * 100) + '%';
  updateLyrics(t);
});

audio.addEventListener('ended', () => {
  lines.forEach(l => { l.textContent = ''; l.className = 'lyric-line'; });
  setTimeout(() => {
    const el = lines[1];
    el.textContent = '🤍';
    el.classList.add('active');
  }, 800);
});
</script>
</body>
</html>
